name: macOS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: brew install cmake ninja glslang spirv-cross
      - name: Configure
        run: cmake -S . -B build/macos-arm64 -G Ninja -C macos/cache.cmake -DNOX_BUILD_METAL_TESTS=ON
      - name: Build client, app and GPU checks
        run: cmake --build build/macos-arm64 --target noxsdl_bundle nox_metal_smoke nox_gpu_atlas_tests -j 3
      - name: Startup and migration tests
        run: |
          cmake -S macos/tests -B build/mac-tests -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/mac-tests
          ctest --test-dir build/mac-tests --output-on-failure
      # Metal runtime checks run locally on a real graphics session.
      - name: Package
        run: ditto -c -k --keepParent "build/macos-arm64/NoX Core.app" build/NoXCore-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NoXCore-macOS-arm64
          path: build/NoXCore-macOS-arm64.zip
